---
name: lint
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call: # so composite actions can use this
permissions:
  pull-requests: write # changie-validation in the shared workflow needs write
  contents: read
  checks: write
  statuses: write
jobs:
  lint:
    uses: delineaxpm/github-workflows/.github/workflows/lint.yml@main
    secrets: inherit
