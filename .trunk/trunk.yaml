version: 0.1
actions:
  enabled:
    - trunk-announce
    - trunk-cache-prune
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
    - go-mod-vendor
  definitions:
    - id: go-mod-vendor
      description: When go mod or sum is updated, go vendoring should be run to ensure it's consistent.
      runtime: go
      run: mod vendor
      triggers:
        - files: [go.mod]
runtimes:
  enabled:
    - go@1.26.8
    - node@22.16.0
    - python@3.10.8
lint:
  enabled:
    - checkov@3.1.61
    - osv-scanner@1.5.0
    - oxipng@9.0.0
    - renovate@37.134.0
    - terrascan@1.18.11
    - trivy@0.74.0
    - trufflehog@3.63.9
    - actionlint@1.6.26
    - git-diff-check
    - gitleaks@8.18.1
    - gofmt@1.20.4
    - golangci-lint@1.64.8
    - hadolint@2.12.0
    - markdownlint@0.38.0
    - prettier@3.2.2
    - shellcheck@0.9.0
    - shfmt@3.6.0
    - taplo@0.8.1
    - yamllint@1.33.0
  threshold:
    - linters: [markdownlint]
      level: high
  ignore:
    - linters: [ALL]
      paths:
        - .devcontainer/init
        - vendor/*
    - linters: [markdownlint]
      paths:
        # in progress changelog notes
        - .changes/*.md
    - linters: [yamllint]
      paths:
        - .changes/unreleased/*.yaml
    - linters: [checkov, trufflehog, trivy]
      paths:
        - .changes/**
        - .trunk/**

cli:
  version: 1.22.2
plugins:
  sources:
    - id: trunk
      ref: v1.6.1
      uri: https://github.com/trunk-io/plugins
